<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panda Apps - Mobile app developer">
    <title>Panda Apps - Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .tagline {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .divider {
            height: 2px;
            background: linear-gradient(to right, transparent, #667eea, transparent);
            margin: 30px 0;
        }
        
        .info {
            margin: 20px 0;
            text-align: left;
        }
        
        .info h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .info p {
            color: #555;
            margin-bottom: 10px;
        }
        
        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }
        
        a {
            color: #667eea;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐼</div>
        <h1>Panda Apps</h1>
        <p class="tagline">Creating delightful mobile experiences</p>
        
        <div class="divider"></div>
        
        <div class="info">
            <h2>About Us</h2>
            <p>We develop mobile applications focused on user experience and quality.</p>
        </div>
        
        <div class="info">
            <h2>Contact</h2>
            <p>For support or inquiries, please reach out through your app's store listing.</p>
        </div>
        
        <div class="footer">
            <p>&copy; 2026 Panda Apps. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
